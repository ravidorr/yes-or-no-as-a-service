<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>YESorNOaaS</title>
    <script src="/theme-bootstrap.js"></script>
    __PENDO_SNIPPET__
    <link rel="stylesheet" href="/styles.css">
  </head>
  <body data-mode="__PAGE_MODE__">
    <main class="card">
      <header class="bar">
        <div class="brand">YESorNOaaS</div>
        <div class="bar-right">
          <span class="mode"></span>
          <button id="theme-toggle" class="theme" type="button" aria-label="Switch to dark theme"></button>
        </div>
      </header>

      <div class="body" data-state="initial">
        <h1 id="page-heading">Ask a yes/no question</h1>

        <form id="ask-form" class="ask">
          <label for="request">Ask a yes/no question</label>
          <div class="ask-row">
            <input id="request" class="field" name="request" type="text" placeholder="Ask anything" autocomplete="off">
            <button id="submit" class="btn btn-primary" type="submit" disabled>
              <span>Ask</span><span aria-hidden="true">→</span>
            </button>
          </div>
        </form>

        <div id="empty" class="slot slot-empty">
          <span id="empty-hint" class="slot-hint"></span>
          <span class="slot-mark" aria-hidden="true">?</span>
        </div>
        <div id="status" class="slot slot-loading" role="status" hidden>
          <span class="flip-wrap" aria-hidden="true"><span class="flip">
            <span class="face face-y">Y</span><span class="face face-n">N</span>
          </span></span>
          <span>Waiting for YESorNOaaS</span>
        </div>
        <div id="error" class="slot slot-error" role="alert" hidden>
          <div class="error-head">
            <b class="error-badge">ERROR</b>
            <span class="error-title"></span>
          </div>
          <span class="error-text"></span>
        </div>
        <div id="answer" class="answer" data-answer="yes" role="status" aria-live="polite" hidden>
          <div class="answer-tag">Answer</div>
          <div id="answer-text" class="answer-text"></div>
        </div>
      </div>

      <section id="share" class="share" hidden>
        <h2 class="share-title"><span class="check" aria-hidden="true">✓</span>Share the link below.</h2>
        <div>
          <label for="share-url" id="link-label" class="link-label"></label>
          <p id="share-help" class="link-desc"></p>
        </div>
        <input id="share-url" class="url" type="url" readonly value="" aria-describedby="share-help">
        <div class="pair">
          <button id="copy" class="btn btn-primary" type="button">
            <span>Copy link</span>
            <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="9" y="9" width="13" height="13" rx="0" ry="0"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>
          </button>
          <button id="preview" class="btn btn-plain" type="button">
            <span>Preview link</span>
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/><polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/></svg>
          </button>
        </div>
        <div class="social" role="group" aria-label="Share link">
          <a id="share-x-link" href="#" target="_blank" rel="noopener noreferrer" aria-label="X" aria-disabled="true">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M18.901 1.153h3.68l-8.04 9.19L24 22.846h-7.406l-5.8-7.584-6.638 7.584H.474l8.6-9.83L0 1.154h7.594l5.243 6.932ZM17.61 20.644h2.039L6.486 3.24H4.298Z"/></svg>
            <span>X</span>
          </a>
          <a id="share-facebook-link" href="#" target="_blank" rel="noopener noreferrer" aria-label="Facebook" aria-disabled="true">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M24 12.073c0-6.627-5.373-12-12-12s-12 5.373-12 12c0 5.99 4.388 10.954 10.125 11.854v-8.385H7.078v-3.47h3.047V9.43c0-3.007 1.792-4.669 4.533-4.669 1.312 0 2.686.235 2.686.235v2.953H15.83c-1.491 0-1.956.925-1.956 1.874v2.25h3.328l-.532 3.47h-2.796v8.385C19.612 23.027 24 18.062 24 12.073z"/></svg>
            <span>Facebook</span>
          </a>
          <a id="share-linkedin-link" href="#" target="_blank" rel="noopener noreferrer" aria-label="LinkedIn" aria-disabled="true">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20.447 20.452h-3.554v-5.569c0-1.328-.027-3.037-1.852-3.037-1.853 0-2.136 1.445-2.136 2.939v5.667H9.351V9h3.414v1.561h.046c.477-.9 1.637-1.85 3.37-1.85 3.601 0 4.267 2.37 4.267 5.455v6.286zM5.337 7.433c-1.144 0-2.063-.926-2.063-2.065 0-1.138.92-2.063 2.063-2.063 1.14 0 2.064.925 2.064 2.063 0 1.139-.925 2.065-2.064 2.065zm1.782 13.019H3.555V9h3.564v11.452zM22.225 0H1.771C.792 0 0 .774 0 1.729v20.542C0 23.227.792 24 1.771 24h20.451C23.2 24 24 23.227 24 22.271V1.729C24 .774 23.2 0 22.222 0h.003z"/></svg>
            <span>LinkedIn</span>
          </a>
          <a id="share-email-link" href="#" aria-label="Email" aria-disabled="true">
            <svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="4" width="20" height="16" rx="0"/><path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"/></svg>
            <span>Email</span>
          </a>
          <a id="share-whatsapp-link" href="#" target="_blank" rel="noopener noreferrer" aria-label="WhatsApp" aria-disabled="true">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 01-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 01-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 012.893 6.994c-.003 5.45-4.435 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0012.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 005.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 00-3.48-8.413Z"/></svg>
            <span>WhatsApp</span>
          </a>
        </div>
        <div class="replays-label">Try another answer</div>
        <nav id="replays" class="replays" aria-label="Other answers"></nav>
        <p id="share-status" class="share-status" aria-live="polite"></p>
      </section>
    </main>

    <script type="module" src="/app.js"></script>
  </body>
</html>
