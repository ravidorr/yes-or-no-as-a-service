<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>YESorNOaaS - Page not found</title>
    <script type="module" src="/theme-bootstrap.js"></script>
    <link rel="stylesheet" href="/styles.css">
  </head>
  <body data-mode="404">
    <main class="card">
      <header class="bar">
        <div class="brand">YESorNOaaS</div>
        <div class="bar-right">
          <span class="mode">404</span>
          <button id="theme-toggle" class="theme" type="button" aria-label="Switch to dark theme"></button>
        </div>
      </header>
      <div class="nf-top">
        <div class="nf-code" role="img" aria-label="Error 404">404</div>
        <h1>Page not found</h1>
      </div>
      <hr class="nf-rule">
      <section class="nf-links">
        <div class="nf-label">Ask a question on</div>
        <nav aria-label="Pages">
          <a href="/yes"><span>Yes! page</span><span aria-hidden="true">→</span></a>
          <a href="/no"><span>No! page</span><span aria-hidden="true">→</span></a>
          <a href="/random"><span>Random page</span><span aria-hidden="true">→</span></a>
        </nav>
      </section>
    </main>
    <script type="module" src="/404.js"></script>
  </body>
</html>
