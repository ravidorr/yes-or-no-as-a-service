<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>YESorNOaaS - Random</title>
    <link rel="stylesheet" href="/styles.css">
  </head>
  <body data-answer="random">
    <main class="app">
      <section class="panel" aria-labelledby="title">
        <header class="header">
          <h1 id="title">Ask a yes/no question and get a random Yes! or No! response</h1>
        </header>

        <form id="yesornoaas-form" class="form">
          <label for="request-text">Ask a yes/no question</label>
          <div class="input-row">
            <input
              id="request-text"
              name="request"
              type="text"
              autocomplete="off"
              placeholder="Ask anything"
            >
            <button id="submit-button" type="submit" disabled>Ask for Random!</button>
          </div>
        </form>

        <div id="status-row" class="status-row" aria-live="polite" hidden>
          <span id="loading" class="loading" hidden>
            <span class="spinner" aria-hidden="true"></span>
            Waiting for YESorNOaaS
          </span>
          <span id="status" class="status"></span>
        </div>

        <output id="response" class="response" hidden></output>

        <div id="share-row" class="share-row" hidden>
          <p class="done-text">All done. Share the link below.</p>
          <label for="share-link">YESorNOaaS random link</label>
          <p id="share-help" class="help-text">
            Opening this link shows the question and a new random Yes! or No! reply.
          </p>
          <div class="input-row">
            <input
              id="share-link"
              type="url"
              readonly
              aria-describedby="share-help"
              placeholder="Type a request to generate a link"
            >
          </div>
          <div class="share-actions">
            <button id="copy-url-button" type="button" disabled>Copy link</button>
            <button id="preview-link-button" type="button" disabled>Preview link</button>
          </div>
          <div class="social-share" role="group" aria-label="Share YESorNOaaS random link">
            <p class="social-label">Share link</p>
            <div class="social-actions">
              <a id="share-x-link" class="social-link" href="#" target="_blank" rel="noopener noreferrer" aria-label="Share on X" title="Share on X" aria-disabled="true">
                <svg viewBox="0 0 448 512" aria-hidden="true">
                  <path d="M357.2 48 427.8 48 273.6 224.2 455 464 313 464 201.7 318.6 74.5 464 3.8 464 168.7 275.5-5.2 48 140.4 48 240.9 180.9 357.2 48zM332.4 421.8l39.1 0-252.4-333.8-42 0 255.3 333.8z"/>
                </svg>
              </a>
              <a id="share-facebook-link" class="social-link" href="#" target="_blank" rel="noopener noreferrer" aria-label="Share on Facebook" title="Share on Facebook" aria-disabled="true">
                <svg viewBox="0 0 320 512" aria-hidden="true">
                  <path d="M80 299.3l0 212.7 116 0 0-212.7 86.5 0 18-97.8-104.5 0 0-34.6c0-51.7 20.3-71.5 72.7-71.5 16.3 0 29.4 .4 37 1.2l0-88.7C291.4 4 256.4 0 236.2 0 129.3 0 80 50.5 80 159.4l0 42.1-66 0 0 97.8 66 0z"/>
                </svg>
              </a>
              <a id="share-linkedin-link" class="social-link" href="#" target="_blank" rel="noopener noreferrer" aria-label="Share on LinkedIn" title="Share on LinkedIn" aria-disabled="true">
                <svg viewBox="0 0 448 512" aria-hidden="true">
                  <path d="M100.3 448l-92.9 0 0-299.1 92.9 0 0 299.1zM53.8 108.1C24.1 108.1 0 83.5 0 53.8 0 39.5 5.7 25.9 15.8 15.8s23.8-15.8 38-15.8 27.9 5.7 38 15.8 15.8 23.8 15.8 38c0 29.7-24.1 54.3-53.8 54.3zM447.9 448l-92.7 0 0-145.6c0-34.7-.7-79.2-48.3-79.2-48.3 0-55.7 37.7-55.7 76.7l0 148.1-92.8 0 0-299.1 89.1 0 0 40.8 1.3 0c12.4-23.5 42.7-48.3 87.9-48.3 94 0 111.3 61.9 111.3 142.3l0 164.3-.1 0z"/>
                </svg>
              </a>
              <a id="share-email-link" class="social-link" href="#" aria-label="Share by email" title="Share by email" aria-disabled="true">
                <svg viewBox="0 0 512 512" aria-hidden="true">
                  <path d="M48 64c-26.5 0-48 21.5-48 48 0 15.1 7.1 29.3 19.2 38.4l208 156c17.1 12.8 40.5 12.8 57.6 0l208-156c12.1-9.1 19.2-23.3 19.2-38.4 0-26.5-21.5-48-48-48L48 64zM0 196 0 384c0 35.3 28.7 64 64 64l384 0c35.3 0 64-28.7 64-64l0-188-198.4 148.8c-34.1 25.6-81.1 25.6-115.2 0L0 196z"/>
                </svg>
              </a>
              <a id="share-whatsapp-link" class="social-link" href="#" target="_blank" rel="noopener noreferrer" aria-label="Share on WhatsApp" title="Share on WhatsApp" aria-disabled="true">
                <svg viewBox="0 0 448 512" aria-hidden="true">
                  <path d="M380.9 97.1c-41.9-42-97.7-65.1-157-65.1-122.4 0-222 99.6-222 222 0 39.1 10.2 77.3 29.6 111L0 480 117.7 449.1c32.4 17.7 68.9 27 106.1 27l.1 0c122.3 0 224.1-99.6 224.1-222 0-59.3-25.2-115-67.1-157zm-157 341.6c-33.2 0-65.7-8.9-94-25.7l-6.7-4-69.8 18.3 18.6-68.1-4.4-7c-18.5-29.4-28.2-63.3-28.2-98.2 0-101.7 82.8-184.5 184.6-184.5 49.3 0 95.6 19.2 130.4 54.1s56.2 81.2 56.1 130.5c0 101.8-84.9 184.6-186.6 184.6zM325.1 300.5c-5.5-2.8-32.8-16.2-37.9-18-5.1-1.9-8.8-2.8-12.5 2.8s-14.3 18-17.6 21.8c-3.2 3.7-6.5 4.2-12 1.4-32.6-16.3-54-29.1-75.5-66-5.7-9.8 5.7-9.1 16.3-30.3 1.8-3.7 .9-6.9-.5-9.7s-12.5-30.1-17.1-41.2c-4.5-10.8-9.1-9.3-12.5-9.5-3.2-.2-6.9-.2-10.6-.2s-9.7 1.4-14.8 6.9c-5.1 5.6-19.4 19-19.4 46.3s19.9 53.7 22.6 57.4c2.8 3.7 39.1 59.7 94.8 83.8 35.2 15.2 49 16.5 66.6 13.9 10.7-1.6 32.8-13.4 37.4-26.4s4.6-24.1 3.2-26.4c-1.3-2.5-5-3.9-10.5-6.6z"/>
                </svg>
              </a>
            </div>
          </div>
          <nav class="mode-nav" aria-label="Other YESorNOaaS answer modes">
            <a href="/yes">Get a &quot;Yes!&quot; replay</a>
            <a href="/no">Get a &quot;No!&quot; replay</a>
          </nav>
          <p id="share-status" class="share-status" aria-live="polite"></p>
        </div>
      </section>
    </main>

    <script type="module" src="/app.js"></script>
  </body>
</html>
