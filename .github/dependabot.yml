version: 2

updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    ignore:
      # Stale advisory or no resolvable upgrade path in this lockfile.
      - dependency-name: uuid
      - dependency-name: tmp
      # Pinned via package.json overrides for markdownlint-cli2 / micromark-math.
      - dependency-name: katex
      - dependency-name: smol-toml
    groups:
      npm-production:
        patterns:
          - '@modelcontextprotocol/*'
          - express
      npm-development:
        dependency-type: development
        patterns:
          - '*'

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
