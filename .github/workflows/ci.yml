name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  quality:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run lint checks
        run: npm run lint

      - name: Run type checks
        run: npm run typecheck

      - name: Run tests with 100% coverage
        run: npm run test:coverage

      - name: Audit production dependencies
        run: npm audit --omit=dev

      - name: Validate release metadata on pull request
        if: github.event_name == 'pull_request'
        run: BASE_REF=origin/${{ github.base_ref }} node scripts/check-release.mjs

      - name: Validate release metadata on push
        if: github.event_name == 'push'
        run: BASE_REF=${{ github.event.before }} node scripts/check-release.mjs

  release-notes:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Verify version and changelog on pull request
        if: github.event_name == 'pull_request'
        run: node scripts/verify-release-notes.mjs --base origin/${{ github.base_ref }}

      - name: Verify version and changelog on push
        if: github.event_name == 'push' && github.event.before != '0000000000000000000000000000000000000000'
        run: node scripts/verify-release-notes.mjs --base ${{ github.event.before }}

  test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests with 100% coverage
        run: npm run test:coverage

  lint:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run linters
        run: npm run lint

  package:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Smoke-test npm pack tarball
        run: npm run test:package

  e2e:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run browser UI tests
        run: npm run test:e2e

  smoke:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build Docker image
        run: docker build -t yesornoaas:ci .

      - name: Smoke-test the built container image
        run: |
          require_container() {
            if ! docker ps --format '{{.Names}}' | grep -qx "$1"; then
              echo "$1 is not running"
              docker logs "$1" 2>&1 || true
              exit 1
            fi
          }

          wait_for_health() {
            local url="$1"
            local name="$2"

            for attempt in {1..20}; do
              if curl --fail --silent --max-time 5 --output /dev/null "$url"; then
                return 0
              fi

              if [ "$attempt" -eq 20 ]; then
                docker logs "$name"
                exit 1
              fi

              sleep 0.5
            done
          }

          cleanup() {
            docker rm -f yesornoaas-ci yesornoaas-ci-alt >/dev/null 2>&1 || true
          }
          trap cleanup EXIT

          docker run -d --name yesornoaas-ci -p 3000:3000 yesornoaas:ci
          wait_for_health http://127.0.0.1:3000/health yesornoaas-ci
          require_container yesornoaas-ci

          expected_version="$(node -p "JSON.parse(require('node:fs').readFileSync('package.json', 'utf8')).version")"

          api_yes_type="$(curl --fail --silent --show-error --max-time 5 --output api-yes.txt --write-out '%{content_type}' http://127.0.0.1:3000/api/yes)"
          [ "$api_yes_type" = "text/plain; charset=utf-8" ]
          [ "$(cat api-yes.txt)" = "Yes!" ]

          api_no_type="$(curl --fail --silent --show-error --max-time 5 --output api-no.txt --write-out '%{content_type}' http://127.0.0.1:3000/api/no)"
          [ "$api_no_type" = "text/plain; charset=utf-8" ]
          [ "$(cat api-no.txt)" = "No!" ]

          api_random_type="$(curl --fail --silent --show-error --max-time 5 --output api-random.txt --write-out '%{content_type}' http://127.0.0.1:3000/api/random)"
          [ "$api_random_type" = "text/plain; charset=utf-8" ]
          grep -E '^(Yes!|No!)$' api-random.txt
          curl --fail --silent --show-error --max-time 5 -D api-random-headers.txt -o /dev/null http://127.0.0.1:3000/api/random
          grep -iq '^cache-control: no-store' api-random-headers.txt

          health_type="$(curl --fail --silent --show-error --max-time 5 --output health.json --write-out '%{content_type}' http://127.0.0.1:3000/health)"
          [ "$health_type" = "application/json; charset=utf-8" ]
          EXPECTED_VERSION="$expected_version" node -e '
            const health = JSON.parse(require("node:fs").readFileSync("health.json", "utf8"));
            if (health.status !== "YESorNOaaS" || health.version !== process.env.EXPECTED_VERSION) {
              throw new Error(`Unexpected health response: ${JSON.stringify(health)}`);
            }
          '

          version_type="$(curl --fail --silent --show-error --max-time 5 --output version.txt --write-out '%{content_type}' http://127.0.0.1:3000/version)"
          [ "$version_type" = "text/plain; charset=utf-8" ]
          [ "$(cat version.txt)" = "$expected_version" ]

          metrics_type="$(curl --fail --silent --show-error --max-time 5 --output metrics.txt --write-out '%{content_type}' http://127.0.0.1:3000/metrics)"
          [ "$metrics_type" = "text/plain; charset=utf-8; version=0.0.4" ]
          grep -q 'yesornoaas_http_requests_total' metrics.txt

          yes_type="$(curl --fail --silent --show-error --max-time 5 --output yes.html --write-out '%{content_type}' http://127.0.0.1:3000/yes)"
          [[ "$yes_type" == text/html* ]]
          grep -q 'data-mode="yes"' yes.html

          no_type="$(curl --fail --silent --show-error --max-time 5 --output no.html --write-out '%{content_type}' http://127.0.0.1:3000/no)"
          [[ "$no_type" == text/html* ]]
          grep -q 'data-mode="no"' no.html

          random_type="$(curl --fail --silent --show-error --max-time 5 --output random.html --write-out '%{content_type}' http://127.0.0.1:3000/random)"
          [[ "$random_type" == text/html* ]]
          grep -q 'data-mode="random"' random.html

          root_status="$(curl --silent --show-error --max-time 5 --output root.txt --write-out '%{http_code}' http://127.0.0.1:3000/)"
          [ "$root_status" = "404" ]
          grep -q 'data-mode="404"' root.txt

          unknown_status="$(curl --silent --show-error --max-time 5 --output unknown.txt --write-out '%{http_code}' http://127.0.0.1:3000/unknown-path)"
          [ "$unknown_status" = "404" ]
          grep -q 'data-mode="404"' unknown.txt

          [ "$(docker exec yesornoaas-ci id -u)" != "0" ]

          docker run -d --name yesornoaas-ci-alt -e PORT=8080 -p 8080:8080 yesornoaas:ci
          wait_for_health http://127.0.0.1:8080/health yesornoaas-ci-alt
          require_container yesornoaas-ci
          require_container yesornoaas-ci-alt

          docker stop --time=30 yesornoaas-ci >/dev/null
          [ "$(docker wait yesornoaas-ci)" -eq 0 ]

          draining_status="$(curl --silent --show-error --max-time 5 --output /dev/null --write-out '%{http_code}' http://127.0.0.1:3000/health || true)"
          [ "$draining_status" = "000" ] || [ "$draining_status" = "503" ]
